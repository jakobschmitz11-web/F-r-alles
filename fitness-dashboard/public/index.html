<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Cpath d='M5 17h5l3-8 5 14 3-6h6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="brand"><span class="logo">♥</span><div><h1>Fitness Dashboard</h1><p id="sub">Lade Daten …</p></div></div>
  <div class="controls">
    <div class="seg" id="range" role="group" aria-label="Zeitraum">
      <button data-d="7">7 T</button><button data-d="30" class="on">30 T</button><button data-d="60">60 T</button>
    </div>
    <span class="live" id="live" title="Live-Verbindung"><i></i><span>offline</span></span>
    <button class="btn" id="syncBtn">Jetzt synchronisieren</button>
  </div>
</header>
<div id="banner" hidden></div>
<main>
  <section class="tiles" id="tiles"></section>
  <section class="grid">
    <article class="card wide"><h2>Schritte <small>Ziel 10.000</small></h2><div id="cSteps" class="chart"></div></article>
    <article class="card"><h2>Schlaf <small>Stunden pro Nacht</small></h2><div id="cSleep" class="chart"></div><div class="legend" id="lgSleep"></div></article>
    <article class="card"><h2>Ruhepuls &amp; HRV</h2><div id="cHr" class="chart"></div><div class="legend" id="lgHr"></div></article>
    <article class="card"><h2>Gewicht <small>kg</small></h2><div id="cWeight" class="chart"></div></article>
    <article class="card"><h2>Trainingszeit <small>Min pro Woche</small></h2><div id="cWeek" class="chart"></div><div class="legend" id="lgWeek"></div></article>
    <article class="card wide"><h2>Letzte Workouts <small>12 neueste · alle in Obsidian</small></h2><div class="tablewrap"><table id="wTable"></table></div></article>
    <article class="card wide" id="conn"><h2>Verbindungen &amp; Speicher</h2><div class="conn" id="connBody"></div></article>
  </section>
</main>
<div class="tip" id="tip" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
